# shipit workflows v1 - managed by shipit. Regenerate with `shipit init`; manual edits are overwritten.
name: shipit ci

on:
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager and node version
        id: pm
        run: |
          if [ ! -f package.json ]; then
            echo "pm=none" >> "$GITHUB_OUTPUT"
            echo "No package.json; nothing to run."
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then PM=pnpm; elif [ -f yarn.lock ]; then PM=yarn; else PM=npm; fi
          NODE=""
          if [ -f .nvmrc ]; then NODE=$(cat .nvmrc); else NODE=$(node -p "require('./package.json').engines?.node ?? ''"); fi
          NODE=$(echo "$NODE" | sed -E 's/^[^0-9]*([0-9]+).*/\1/')
          [ -n "$NODE" ] || NODE=20
          echo "pm=$PM" >> "$GITHUB_OUTPUT"
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "package manager: $PM, node: $NODE"

      - uses: actions/setup-node@v4
        if: steps.pm.outputs.pm != 'none'
        with:
          node-version: ${{ steps.pm.outputs.node }}

      - name: Install dependencies
        if: steps.pm.outputs.pm != 'none'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) npm i -g pnpm@9 && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            npm)  if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac

      - name: Lint, typecheck, test
        if: steps.pm.outputs.pm != 'none'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          for script in lint typecheck test; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              echo "::group::$script"
              "$PM" run "$script"
              echo "::endgroup::"
            else
              echo "no '$script' script in package.json; skipping"
            fi
          done
